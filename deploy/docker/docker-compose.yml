services:
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=DevOnly-P@ssw0rd
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "9200:9200"

  localstack:
    image: localstack/localstack:3
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
    ports:
      - "4566:4566"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ka
      POSTGRES_PASSWORD: ka
      POSTGRES_DB: ka
    ports:
      - "5432:5432"

  # Local embedding model. Keeps the demo keyless and offline: chat-api and
  # the indexer both embed through this. The named volume holds the pulled
  # model across restarts. Note `make dev-down` passes -v, which removes it,
  # so the next `make embed-pull` re-downloads ~270MB.
  #
  # Published on 11435, not 11434, to stay clear of a native Ollama.app.
  # That app binds 127.0.0.1:11434 (IPv4) while this container's port
  # binding takes [::]:11434 (IPv6), so both can hold "port 11434" at once
  # with no bind error -- and `localhost` resolves IPv4-first, silently
  # routing embed calls to the app, which 404s on nomic-embed-text.
  # Distinct ports make the two servers unambiguous. Set KA_OLLAMA_URL to
  # http://localhost:11435 to reach this one.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11435:11434"

volumes:
  ollama-models:
