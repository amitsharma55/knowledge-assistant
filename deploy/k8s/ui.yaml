apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: knowledge-assistant
spec:
  replicas: 2
  selector:
    matchLabels: { app: ui }
  template:
    metadata:
      labels: { app: ui }
    spec:
      containers:
        - name: ui
          image: <account>.dkr.ecr.us-east-1.amazonaws.com/knowledge-assistant/ui:latest
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: knowledge-assistant
spec:
  selector: { app: ui }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ka
  namespace: knowledge-assistant
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/wafv2-acl-arn: <waf-arn>
spec:
  rules:
    - host: ka.internal.example.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend: { service: { name: chat-api, port: { number: 8080 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: ui, port: { number: 80 } } }
