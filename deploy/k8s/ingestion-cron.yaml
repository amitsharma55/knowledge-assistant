apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingestion-gitlab
  namespace: knowledge-assistant
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: ingestion  # IRSA: bedrock + opensearch + s3
          restartPolicy: OnFailure
          containers:
            - name: indexer
              image: <account>.dkr.ecr.us-east-1.amazonaws.com/knowledge-assistant/ingestion:latest
              args: ["-source=gitlab"]
              env:
                - { name: KA_OPENSEARCH_URL, valueFrom: { secretKeyRef: { name: ka-config, key: opensearch_url } } }
                - { name: KA_GITLAB_URL,     valueFrom: { secretKeyRef: { name: ka-config, key: gitlab_url } } }
                - { name: KA_GITLAB_TOKEN,   valueFrom: { secretKeyRef: { name: ka-config, key: gitlab_token } } }
                - { name: KA_GITLAB_PROJECT, valueFrom: { secretKeyRef: { name: ka-config, key: gitlab_project } } }
                - { name: KA_GITLAB_REF,     value: "main" }
                - { name: KA_GITLAB_PATH,    value: "docs" }
                - { name: KA_GITLAB_INCLUDE_REPO, value: "true" }
                - { name: KA_GITLAB_INCLUDE_WIKI, value: "true" }
              resources:
                requests: { cpu: "500m", memory: "512Mi" }
                limits:   { cpu: "2",    memory: "2Gi" }
