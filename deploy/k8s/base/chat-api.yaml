apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-api
  namespace: knowledge-assistant
spec:
  replicas: 1
  selector:
    matchLabels: { app: chat-api }
  template:
    metadata:
      labels: { app: chat-api }
    spec:
      serviceAccountName: chat-api  # EKS Pod Identity: Bedrock + Secrets Manager + OpenSearch
      initContainers:
        # chat-api connects to Postgres once at startup and, on failure, runs
        # permanently without persistence (main.go: "will not persist"). Block
        # until Postgres accepts connections so repo.New succeeds and schema.sql
        # runs. Reuses the postgres image (already pulled) for pg_isready.
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h postgres -p 5432 -U ka -d ka; do
                echo "waiting for postgres..."; sleep 2
              done
      containers:
        - name: chat-api
          image: ka/chat-api:placeholder  # overlay rewrites via images: transformer
          ports: [{ containerPort: 8080 }]
          env:
            - { name: KA_LLM_MODE, value: anthropic }
            - { name: AWS_REGION, value: us-east-1 }
            # Must match foundation's anthropic_secret_name.
            - { name: KA_ANTHROPIC_SECRET_ID, value: ka/anthropic-api-key }
            - { name: KA_EMBED_MODE, value: bedrock }
            - { name: KA_EMBED_MODEL, value: "amazon.titan-embed-text-v2:0" }
            - { name: KA_EMBED_DIM, value: "1024" }
            - { name: KA_RERANK_MODE, value: bedrock }
            - { name: KA_RERANK_MODEL, value: "openai.gpt-oss-20b-1:0" }
            - { name: KA_REWRITE_MODE, value: bedrock }
            - { name: KA_REWRITE_MODEL, value: "openai.gpt-oss-20b-1:0" }
            # PROVISIONAL: 0.81 is calibrated for local nomic-768. Recalibrate
            # for Titan-v2 with /check-retrieval against the running stack.
            # Local nomic on the 150-doc corpus (2026-09-15): answerable
            # questions bottom out at ~0.78 and unanswerable/reject at ~0.76,
            # so 0.81 sits slightly high locally (flags a couple of answerable
            # near-twins); ~0.78 separates more cleanly. Titan-v2 value is
            # still the live-stack recalibration below.
            - { name: KA_RELEVANCE_FLOOR, value: "0.81" }
            - name: KA_OPENSEARCH_URL
              valueFrom: { configMapKeyRef: { name: ka-config, key: opensearch_url } }
            # In-cluster ephemeral Postgres (deploy/k8s/base/postgres.yaml).
            # Chats persist while the stack is up and die with it (emptyDir).
            - name: KA_POSTGRES_DSN
              value: postgres://ka:ka@postgres:5432/ka?sslmode=disable
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: chat-api
  namespace: knowledge-assistant
spec:
  selector: { app: chat-api }
  ports:
    - { port: 8080, targetPort: 8080 }
